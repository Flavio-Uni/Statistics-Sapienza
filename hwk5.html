<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDE Simulation with Drift and Diffusion</title>
    <style>
        body {
            background-color: #303030;
            color: #e0e0e0;
        }
        .chart-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #simulationChart {
            width: 100%;
            height: 100%;
            border: 1px solid #e0e0e0;
        }
        .settings-panel {
            text-align: center;
            margin-top: 20px;
        }
        .settings-panel label, .settings-panel input, .settings-panel select {
            margin: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h3>Stochastic Differential Equation (SDE) Simulator</h3>

    <div class="chart-wrapper">
        <canvas id="simulationChart"></canvas>
    </div>

    <div class="settings-panel">
        <label for="sdeType">SDE Type: </label>
        <select id="sdeType">
            <option value="brownian">Brownian Motion</option>
            <option value="drift">Brownian with Drift</option>
            <option value="ou">Ornstein-Uhlenbeck</option>
        </select>
        <label for="driftRate">Drift Rate: </label>
        <input type="number" id="driftRate" step="0.1" value="0.1" min="-2" max="2">
        <label for="diffusionRate">Diffusion Rate: </label>
        <input type="number" id="diffusionRate" step="0.1" value="0.5" min="0" max="10">
        <label for="totalSteps">Total Steps: </label>
        <input type="number" id="totalSteps" value="500" min="10" max="10000">
        <button onclick="launchSimulation()">Run Simulation</button>
    </div>

    <script>
        const simulationChart = document.getElementById('simulationChart');
        const simulationCtx = simulationChart.getContext('2d');

        let driftRate, diffusionRate, totalSteps, stepInterval;
        let pathValues = [];

        function launchSimulation() {
            const sdeType = document.getElementById('sdeType').value;
            driftRate = parseFloat(document.getElementById('driftRate').value);
            diffusionRate = parseFloat(document.getElementById('diffusionRate').value);
            totalSteps = parseInt(document.getElementById('totalSteps').value);
            stepInterval = 1 / totalSteps;

            simulationChart.width = document.querySelector('.chart-wrapper').clientWidth * 0.9;
            simulationChart.height = 400;

            simulationCtx.clearRect(0, 0, simulationChart.width, simulationChart.height);
            pathValues = [];

            // Choose the SDE simulation based on selected type
            if (sdeType === "brownian") {
                simulateBrownianMotion();
            } else if (sdeType === "drift") {
                simulateBrownianWithDrift();
            } else if (sdeType === "ou") {
                simulateOrnsteinUhlenbeck();
            }

            drawPath();
        }

        function simulateBrownianMotion() {
            let position = 0;
            pathValues.push(position);

            for (let i = 1; i <= totalSteps; i++) {
                let step = diffusionRate * Math.sqrt(stepInterval) * (Math.random() < 0.5 ? 1 : -1);
                position += step;
                pathValues.push(position);
            }
        }

        function simulateBrownianWithDrift() {
            let position = 0;
            pathValues.push(position);

            for (let i = 1; i <= totalSteps; i++) {
                let step = driftRate * stepInterval + diffusionRate * Math.sqrt(stepInterval) * (Math.random() < 0.5 ? 1 : -1);
                position += step;
                pathValues.push(position);
            }
        }

        function simulateOrnsteinUhlenbeck() {
            let position = 0;
            const meanReversion = 0.2;  // Mean reversion rate

            pathValues.push(position);

            for (let i = 1; i <= totalSteps; i++) {
                let step = meanReversion * (0 - position) * stepInterval + diffusionRate * Math.sqrt(stepInterval) * (Math.random() < 0.5 ? 1 : -1);
                position += step;
                pathValues.push(position);
            }
        }

        function drawPath() {
            const stepWidth = simulationChart.width / totalSteps;
            const midY = simulationChart.height / 2;
            const scaleFactor = simulationChart.height / 4;

            simulationCtx.strokeStyle = '#ff4d4d'; // Red color for the graph
            simulationCtx.beginPath();
            simulationCtx.moveTo(0, midY);

            for (let i = 1; i < pathValues.length; i++) {
                const xPos = i * stepWidth;
                const yPos = midY - pathValues[i] * scaleFactor;
                simulationCtx.lineTo(xPos, yPos);
            }

            simulationCtx.stroke();

            const meanValue = computeMean(pathValues);
            const varianceValue = computeVariance(pathValues, meanValue);

            simulationCtx.fillStyle = '#ffffff';
            simulationCtx.font = '14px Arial';
            simulationCtx.fillText(`Mean: ${meanValue.toFixed(4)}`, 10, 20);
            simulationCtx.fillText(`Variance: ${varianceValue.toFixed(4)}`, 10, 40);
        }

        function computeMean(dataSet) {
            return dataSet.reduce((total, value) => total + value, 0) / dataSet.length;
        }

        function computeVariance(dataSet, meanValue) {
            return dataSet.reduce((total, value) => total + Math.pow(value - meanValue, 2), 0) / dataSet.length;
        }
    </script>
</body>
</html>
