<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brownian Motion Simulation</title>
    <style>
        body {
            background-color: #212121;
            color: #fff;
        }
        .visual-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #plotArea {
            width: 100%;
            height: 100%;
            border: 1px solid #fff;
        }
        .user-inputs {
            text-align: center;
            margin-top: 20px;
        }
        .user-inputs label, .user-inputs input {
            margin: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h3>Brownian Motion Approximation with Random Steps</h3>

    <div class="visual-container">
        <canvas id="plotArea"></canvas>
    </div>

    <div class="user-inputs">
        <label for="stepRate">Step Rate (Intensity): </label>
        <input type="number" id="stepRate" step="0.1" value="0.5" min="0" max="10">
        <label for="numSteps">Number of Steps: </label>
        <input type="number" id="numSteps" value="500" min="10" max="10000">
        <button onclick="initiateSimulation()">Start Simulation</button>
    </div>

    <script>
        const plotArea = document.getElementById('plotArea');
        const plotCtx = plotArea.getContext('2d');

        let stepRate, numSteps, deltaT;
        let brownianPath = [];  // Array to store Brownian motion values

        function initiateSimulation() {
            stepRate = parseFloat(document.getElementById('stepRate').value);
            numSteps = parseInt(document.getElementById('numSteps').value);
            deltaT = 1 / numSteps;

            plotArea.width = document.querySelector('.visual-container').clientWidth * 0.9;
            plotArea.height = 400;

            plotCtx.clearRect(0, 0, plotArea.width, plotArea.height);
            brownianPath = [];

            simulateBrownianPath();
            renderBrownianPath();
        }

        function simulateBrownianPath() {
            let currentPosition = 0;  // Start at zero for Brownian motion
            brownianPath.push(currentPosition);

            for (let i = 1; i <= numSteps; i++) {
                // Calculate step size ±sqrt(deltaT)
                let stepSize = (Math.random() < 0.5 ? 1 : -1) * Math.sqrt(deltaT);
                currentPosition += stepSize;
                brownianPath.push(currentPosition);
            }
        }

        function renderBrownianPath() {
            const stepWidth = plotArea.width / numSteps;
            const centerY = plotArea.height / 2;
            const scalingFactor = plotArea.height / 4; // Adjust scale for visualization

            plotCtx.strokeStyle = '#f4a742';
            plotCtx.beginPath();
            plotCtx.moveTo(0, centerY);

            for (let i = 1; i < brownianPath.length; i++) {
                const x = i * stepWidth;
                const y = centerY - brownianPath[i] * scalingFactor;
                plotCtx.lineTo(x, y);
            }

            plotCtx.stroke();

            // Displaying mean and variance at the end
            const mean = calculateMean(brownianPath);
            const variance = calculateVariance(brownianPath, mean);

            plotCtx.fillStyle = '#fff';
            plotCtx.font = '14px Arial';
            plotCtx.fillText(`Mean: ${mean.toFixed(4)}`, 10, 20);
            plotCtx.fillText(`Variance: ${variance.toFixed(4)}`, 10, 40);
        }

        function calculateMean(dataset) {
            return dataset.reduce((acc, val) => acc + val, 0) / dataset.length;
        }

        function calculateVariance(dataset, mean) {
            return dataset.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / dataset.length;
        }
    </script>
</body>
</html>
